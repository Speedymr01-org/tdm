name: Publish to Modrinth and GitHub Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Read tournament-manager version from pom.xml
        id: tm-version
        shell: bash
        run: |
          # Extract version from the tournament-manager <dependency> block in pom.xml
          version=$(grep -A2 '<artifactId>tournament-manager</artifactId>' pom.xml | grep -m1 -oP '(?<=<version>)[^<]+')
          if [ -z "$version" ]; then
            echo "::error::Could not find tournament-manager version in pom.xml"
            exit 1
          fi
          echo "Resolved tournament-manager version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Checkout tournament-manager dependency
        uses: actions/checkout@v6
        with:
          repository: Speedymr01-org/tournament-manager
          path: tournament-manager
          ref: v${{ steps.tm-version.outputs.version }}
          fetch-depth: 1

      - name: Verify checked-out tag matches pom.xml version
        shell: bash
        working-directory: tournament-manager
        run: |
          expected="v${{ steps.tm-version.outputs.version }}"
          actual=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ "$actual" != "$expected" ]; then
            echo "::error::tournament-manager version mismatch: pom.xml says $expected but checked out commit is '$actual'"
            echo "::error::Make sure tournament-manager has a tag named '$expected' before releasing this plugin."
            exit 1
          fi
          echo "Verified tournament-manager is at $actual"

      - name: Install tournament-manager to local Maven repo
        run: mvn install -DskipTests -q
        working-directory: tournament-manager

      - name: Build project
        run: pwsh ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: plugin
          path: target/TeamDeathmatch-*.jar
          if-no-files-found: error

  publish-modrinth:
    runs-on: ubuntu-latest
    needs: build
    if: "endsWith(github.ref_name, '.0')"
    # Only publish to Modrinth for minor/major versions (v1.1.0, v2.0.0), not patch (v1.0.1)

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin
          path: plugin

      - name: Find JAR file
        id: findjar
        shell: bash
        run: |
          cd plugin
          # build.ps1 ensures only the renamed final JAR exists; match it precisely.
          jar=$(ls TeamDeathmatch-*.jar | head -1)
          if [ -z "$jar" ]; then
            echo "::error::No JAR found matching TeamDeathmatch-*.jar in plugin/"
            exit 1
          fi
          echo "jar=$jar" >> $GITHUB_OUTPUT

      - name: Upload to Modrinth
        uses: RubixDev/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          file_path: plugin/${{ steps.findjar.outputs.jar }}
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          changelog: ""
          relations: ""
          game_versions: 26.1.2
          release_type: release
          loaders: paper
          featured: false
          project_id: ${{ secrets.MODRINTH_SLUG }}
          staging: false
          new_project_body: ""

  github-release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin
          path: plugin

      - name: Find JAR file
        id: findjar
        shell: bash
        run: |
          cd plugin
          # build.ps1 ensures only the renamed final JAR exists; match it precisely.
          jar=$(ls TeamDeathmatch-*.jar | head -1)
          if [ -z "$jar" ]; then
            echo "::error::No JAR found matching TeamDeathmatch-*.jar in plugin/"
            exit 1
          fi
          echo "jar=$jar" >> $GITHUB_OUTPUT

      - name: Delete existing release (if any)
        run: |
          gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            plugin/${{ steps.findjar.outputs.jar }}
